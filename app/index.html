<div id="loading"><h1>잠시만 기다려 주세요...</h1></div>

<div id="ask" class="hide"><h1><span id="co"></span> 담당자님,<br><em>참여 의향을 전달하시겠어요?</em></h1>
<p>구속력은 없습니다. 연락받으실 분 정보를 남겨 주시면 유디임팩트 홍성훈 PM이 확인 후 연락드리겠습니다.</p>
<label for="dept">담당 부서 *</label><input id="dept" placeholder="예) ESG경영팀">
<label for="name">담당자 성함·직함 *</label><input id="name" placeholder="예) 홍길동 과장">
<label for="phone">연락처 *</label><input id="phone" placeholder="예) 02-000-0000 / 010-0000-0000">
<label for="email">이메일 (선택)</label><input id="email" placeholder="연락받으실 메일이 다르면 적어 주세요">
<label for="memo">남기실 말씀 (선택)</label><textarea id="memo" placeholder="연락받기 편한 시간 등"></textarea>
<div id="err" class="err"></div>
<button id="b" type="button">참여 의향 전달하기</button></div>

<div id="done" class="hide"><h1><em>감사합니다.</em><br>참여 의향이 전달되었습니다.</h1>
<p>담당자가 확인 후 곧 연락드리겠습니다.<br>직접 메일로 문의하시려면 <a href="mailto:shhong@udimpact.ai?subject=[참여 의향] K-뉴딜 아카데미">shhong@udimpact.ai</a>로 보내 주세요.</p></div>

<div id="bad" class="hide"><h1>링크를 확인할 수 없습니다.</h1><p>메일로 문의해 주시면 바로 안내드리겠습니다.<br><a href="mailto:shhong@udimpact.ai?subject=[참여 의향] K-뉴딜 아카데미">shhong@udimpact.ai</a></p></div>
</div><div class="foot">유디임팩트 · <a href="https://udimpact.ai" target="_blank" rel="noopener">udimpact.ai</a></div></div>

<script>
var API='https://script.google.com/macros/s/AKfycbxoq0ZndaHD0ZxvaXS84WJvooRA9K-AfAAEuOKMnKlIBhjNdnCGgdkJs_7Ibr5_v68/exec';
var q=new URLSearchParams(location.search), c=q.get('c')||'', t=q.get('t')||'';
function $(i){return document.getElementById(i);}
function show(i){['loading','ask','done','bad'].forEach(function(x){$(x).classList.toggle('hide',x!==i);});}
function val(i){return $(i).value.trim();}
function done(){show('done');}
if(!c||!t){show('bad');}else{
  var shown=false;
  function setCo(d){if(shown)return;shown=true;if(d&&d.ok){$('co').textContent=d.company;show('ask');}else if(d){show('bad');}else{$('co').textContent='귀사';show('ask');}}
  window.__co=function(d){setCo(d);};
  fetch(API+'?mode=info&c='+encodeURIComponent(c)+'&t='+encodeURIComponent(t),{credentials:'omit'}).then(function(r){return r.json();}).then(setCo)
  .catch(function(){var s=document.createElement('script');s.src=API+'?mode=info&callback=__co&c='+encodeURIComponent(c)+'&t='+encodeURIComponent(t);s.onerror=function(){setCo(null);};document.body.appendChild(s);setTimeout(function(){setCo(null);},6000);});
}
$('b').onclick=function(){
  var info={dept:val('dept'),name:val('name'),phone:val('phone'),email:val('email'),memo:val('memo')};
  if(!info.dept||!info.name||!info.phone){$('err').textContent='부서, 성함, 연락처는 꼭 적어 주세요.';return;}
  $('err').textContent='';var b=$('b');b.disabled=true;b.textContent='전달하는 중...';
  var payload=JSON.stringify({c:c,t:t,info:info});
  fetch(API,{method:'POST',credentials:'omit',headers:{'Content-Type':'text/plain;charset=utf-8'},body:payload})
  .then(function(r){return r.json();}).then(function(d){if(d.ok)done();else throw 0;})
  .catch(function(){
    // CORS로 응답을 못 읽는 환경: 숨은 폼으로 제출 (저장은 동일하게 됨)
    var ifr=document.createElement('iframe');ifr.name='sink';ifr.style.display='none';document.body.appendChild(ifr);
    var f=document.createElement('form');f.method='POST';f.action=API;f.target='sink';f.acceptCharset='UTF-8';
    var i=document.createElement('input');i.type='hidden';i.name='payload';i.value=payload;f.appendChild(i);document.body.appendChild(f);
    ifr.onload=done;setTimeout(done,5000);f.submit();
  });
};
</script></body></html>
